name: 'Scout Audit (Soroban)'
description: 'Run the XOXNO Scout Soroban security detectors against your smart contracts.'
author: 'XOXNO'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  contracts:
    description: >-
      Space- or newline-separated list of contract directories (each containing a
      Cargo.toml) or Cargo.toml paths to scan. Defaults to the repository root,
      which scans every member of a root workspace.
    required: false
    default: '.'
  output-format:
    description: 'Report format: md | json | sarif | html.'
    required: false
    default: 'md'
  output-dir:
    description: 'Directory (relative to the workspace) where per-contract reports are written.'
    required: false
    default: 'scout-reports'
  exclude:
    description: 'Comma-separated detector names to exclude (e.g. "dos-unexpected-revert-with-storage").'
    required: false
    default: ''
  toolchain:
    description: 'Detector nightly toolchain. Override only if you know what you are doing.'
    required: false
    default: 'nightly-2026-05-28'
  fail-on-findings:
    description: >-
      Fail the step if any contract produces findings. Only effective with
      output-format json or sarif (the parseable formats).
    required: false
    default: 'false'
  fail-on-severity:
    description: >-
      Fail the step if Scout reports a finding at or above this severity.
      One of: none (default) | critical | medium | minor | enhancement | any.
      Effective only with output-format json. Supersedes fail-on-findings,
      which remains as an alias for "any".
    required: false
    default: 'none'
  extra-args:
    description: 'Extra arguments passed through verbatim to `cargo scout-audit`.'
    required: false
    default: ''
  env:
    description: >-
      Extra environment variables for the build/analysis, as newline-separated
      KEY=VALUE pairs. Applied on top of the action defaults (e.g. override the
      soroban-sdk spec-shaking shim, or pass RUSTFLAGS / feature toggles).
    required: false
    default: ''
  upload-reports:
    description: 'Upload the generated reports as a workflow artifact (no extra step needed in your workflow).'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the uploaded reports artifact.'
    required: false
    default: 'scout-audit-reports'
  retention-days:
    description: 'Days to retain the reports artifact.'
    required: false
    default: '7'

outputs:
  report-dir:
    description: 'Absolute path to the directory containing the generated reports.'
    value: ${{ steps.scout.outputs.report-dir }}

runs:
  using: 'composite'
  steps:
    - name: Install Scout detector toolchain
      shell: bash
      run: |
        rustup toolchain install "${{ inputs.toolchain }}" \
          --component rustc-dev --component llvm-tools-preview --component rust-src \
          --target wasm32v1-none

    - name: Install cargo-scout-audit
      shell: bash
      run: |
        cargo install \
          --path "${{ github.action_path }}/apps/cargo-scout-audit/crates/cargo-scout-audit" \
          --locked

    - name: Run Scout
      id: scout
      shell: bash
      env:
        SCOUT_DIR: ${{ github.action_path }}
        OUT_DIR: ${{ inputs.output-dir }}
        FMT: ${{ inputs.output-format }}
        EXCLUDE: ${{ inputs.exclude }}
        TOOLCHAIN: ${{ inputs.toolchain }}
        CONTRACTS: ${{ inputs.contracts }}
        EXTRA: ${{ inputs.extra-args }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        EXTRA_ENV: ${{ inputs.env }}
        # soroban-sdk's `experimental_spec_shaking_v2` build script hard-errors under
        # plain `cargo check` (it expects `stellar contract build`). Scout only
        # type-checks + lints — it never emits a deployable artifact — so signalling
        # build-system support lets the dependency compile and the contract actually
        # get analyzed instead of silently reporting zero findings. Override via the
        # `env` input if needed.
        SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"
      run: |
        set -euo pipefail
        mkdir -p "$OUT_DIR"

        # sccache caches rustc output and would silently skip the dylint lint pass on
        # cache hits, producing stale (zero) findings — never run Scout under it.
        unset RUSTC_WRAPPER || true

        # Apply any caller-supplied environment (newline-separated KEY=VALUE),
        # so build toggles can be set/overridden without changing the action.
        if [ -n "${EXTRA_ENV:-}" ]; then
          while IFS= read -r kv; do
            [ -n "$kv" ] || continue
            # shellcheck disable=SC2163
            export "$kv"
          done <<< "$EXTRA_ENV"
        fi

        exclude_arg=()
        [ -n "$EXCLUDE" ] && exclude_arg=(--exclude "$EXCLUDE")

        # Resolve the effective gate threshold (fail-on-findings is the "any" alias).
        THRESHOLD="$FAIL_ON_SEVERITY"
        if [ "$THRESHOLD" = "none" ] && [ "$FAIL_ON_FINDINGS" = "true" ]; then
          THRESHOLD="any"
        fi

        incomplete=0
        gated=0
        # CONTRACTS is intentionally unquoted so the list word-splits on whitespace/newlines.
        # shellcheck disable=SC2086
        for c in $CONTRACTS; do
          if [ -f "$c" ]; then manifest="$c"
          elif [ -f "$c/Cargo.toml" ]; then manifest="$c/Cargo.toml"
          else echo "::warning::No Cargo.toml at '$c' — skipping"; continue; fi

          name="$(basename "$(dirname "$manifest")")"
          out="$OUT_DIR/$name.$FMT"
          echo "::group::Scout $manifest"
          # shellcheck disable=SC2086
          if ! cargo "+$TOOLCHAIN" scout-audit \
              --manifest-path "$manifest" \
              --scout-source "$SCOUT_DIR" \
              --local-detectors "$SCOUT_DIR/nightly" \
              "${exclude_arg[@]}" \
              --output-format "$FMT" \
              --output-path "$out" \
              $EXTRA; then
            echo "::error::Scout failed to run for $manifest"
            incomplete=$((incomplete + 1))
          fi
          if [ -f "$out" ] && grep -q "Compilation errors\|report is incomplete" "$out" 2>/dev/null; then
            echo "::error::Scout report for $manifest is incomplete (the contract failed to compile)"
            incomplete=$((incomplete + 1))
          fi
          # Severity gate (JSON only): count findings at or above THRESHOLD.
          if [ "$THRESHOLD" != "none" ] && [ -f "$out" ] && [ "$FMT" = "json" ]; then
            n="$(jq --arg t "$THRESHOLD" '
              (.summary.by_severity // {}) as $s |
              ($s.critical // 0)
              + (if $t=="critical" then 0 else ($s.medium // 0) end)
              + (if ($t=="critical" or $t=="medium") then 0 else ($s.minor // 0) end)
              + (if ($t=="critical" or $t=="medium" or $t=="minor") then 0 else ($s.enhancement // 0) end)
            ' "$out" 2>/dev/null || echo 0)"
            [ "${n:-0}" -gt 0 ] && gated=$((gated + n))
          fi
          echo "::endgroup::"
        done

        echo "report-dir=$(cd "$OUT_DIR" && pwd)" >> "$GITHUB_OUTPUT"
        echo "Scout reports written to $OUT_DIR"

        if [ "$incomplete" -gt 0 ]; then
          echo "::error::$incomplete contract(s) did not analyze cleanly"
          exit 1
        fi
        if [ "$THRESHOLD" != "none" ]; then
          if [ "$FMT" != "json" ]; then
            echo "::warning::fail-on-severity/fail-on-findings needs output-format json; ignoring"
          elif [ "$gated" -gt 0 ]; then
            echo "::error::Scout reported $gated finding(s) at or above severity '$THRESHOLD'"
            exit 1
          fi
        fi

    # Upload the reports as a workflow artifact, so consumers don't have to add their
    # own upload step. Runs even if analysis failed (partial reports are still useful);
    # set upload-reports: false to skip.
    - name: Upload Scout reports
      if: ${{ always() && inputs.upload-reports == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}/
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
