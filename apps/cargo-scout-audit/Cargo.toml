[workspace]
exclude = ["tests"]
members = ["crates/cargo-scout-audit", "crates/scout-driver"]
resolver = "2"

[workspace.package]
keywords = ["auditor", "ink", "security", "smart-contracts", "soroban"]
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/coinfabrik/scout-audit"
version = "0.3.16"
authors = [
    "Agustin Aon <agustin.aon@coinfabrik.com>",
    "Arturo Beccar-Varela <arturo.beccar@coinfabrik.com>",
    "José García Crosta <jose.garcia.crosta@coinfabrik.com>",
    "Víctor M. González <victor.gonzalez@coinfabrik.com>",
    "Facundo Lerena <facundo.lerena@coinfabrik.com>",
    "Agustin Losiggio <agustin.losiggio@coinfabrik.com>",
    "Federico Pinho <federico.pinho@coinfabrik.com>",
    "Ariel Waissbein <ariel.waissbein@coinfabrik.com>",
]

[workspace.dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.102"
cargo = "0.80.0"
cargo_metadata = "0.23.1"
chrono = "0.4.45"
clap = "4.6.1"
colored = "3.1.1"
current_platform = "0.2.0"
dunce = "1.0.5"
dylint = "4.1.0"
git2 = "0.18.3"
home = "0.5.9"
itertools = "0.15.0"
lazy_static = "1.5.0"
libloading = "0.9.0"
once_cell = "1.21.4"
orion = "0.17.15"
regex = "1.12.4"
reqwest = "0.13.4"
semver = "1.0.28"
serde = "1.0.228"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
strum = "0.28.0"
tempfile = "3.27.0"
tera = "1.20.1"
terminal_color_builder = "0.1.1"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
uuid = "1.23.3"
webbrowser = "1.2.1"
windows = "0.62.2"
