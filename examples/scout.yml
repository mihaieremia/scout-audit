# Scout Audit — example workflow.
#
# Copy this file to `.github/workflows/scout.yml` in your Soroban project, edit the
# `contracts:` list below, and you're done. It runs the full Scout Soroban detector
# suite on every pull request and uploads one report per contract as an artifact —
# no upload step to write yourself.
#
# Docs: https://github.com/mihaieremia/scout-audit#github-action

name: Scout Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scout:
    name: Scout Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Scout
        uses: mihaieremia/scout-audit@v1
        with:
          # Space- or newline-separated contract directories (each with a Cargo.toml)
          # or Cargo.toml paths. Defaults to the repo root (scans a root workspace).
          contracts: |
            contracts/my-contract
            contracts/another-contract

          # md | json | sarif | html.
          output-format: md
          output-dir: scout-reports

          # Reports are uploaded automatically as this artifact (set upload-reports: false
          # to skip — e.g. if you upload SARIF to the Security tab yourself, see below).
          upload-reports: true
          artifact-name: scout-audit-reports
          retention-days: 7

          # Optional — comma-separated detectors to skip.
          # exclude: dos-unexpected-revert-with-storage
          # Optional — gate the PR on a severity threshold (json only):
          # output-format: json
          # fail-on-severity: critical   # none|critical|medium|minor|enhancement|any
          # Optional — extra build env, newline-separated KEY=VALUE.
          # env: |
          #   RUSTFLAGS=--cfg something

# ── Variant: surface findings in the repo's Security tab ─────────────────────────────
# Set `output-format: sarif`, `upload-reports: false`, add `permissions: { security-events:
# write }` at the job/workflow level, then a final step:
#   - uses: github/codeql-action/upload-sarif@v3
#     with:
#       sarif_file: scout-reports
