# Scout Audit — example workflow.
#
# Copy this file to `.github/workflows/scout.yml` in your Soroban project, edit the
# `contracts:` list below, and you're done. It runs the full Scout Soroban detector
# suite on every pull request and writes one report per contract.
#
# Docs: https://github.com/mihaieremia/scout-audit#github-action

name: Scout Audit

on:
  pull_request:
  push:
    branches: [main]

# `security-events: write` is only needed for the optional SARIF upload (Security tab).
permissions:
  contents: read
  security-events: write

jobs:
  scout:
    name: Scout Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Optional — ensures rustup/cargo are present (GitHub-hosted runners already have them).
      - uses: dtolnay/rust-toolchain@stable

      - name: Run Scout
        uses: mihaieremia/scout-audit@v1
        with:
          # Space- or newline-separated contract directories (each with a Cargo.toml)
          # or Cargo.toml paths. Defaults to the repo root (scans a root workspace).
          contracts: |
            contracts/my-contract
            contracts/another-contract

          # md | json | sarif | html. Use `sarif` to surface findings in the Security tab.
          output-format: sarif
          output-dir: scout-reports

          # Optional — comma-separated detectors to skip.
          # exclude: dos-unexpected-revert-with-storage

          # Optional — fail the job on any finding (json/sarif only). Default: advisory.
          # fail-on-findings: 'true'

      # Option A — surface findings in the repo's Security tab (needs output-format: sarif).
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-reports

      # Option B — instead, just keep the reports as a downloadable artifact (any format).
      # - name: Upload reports
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: scout-reports
      #     path: scout-reports/
