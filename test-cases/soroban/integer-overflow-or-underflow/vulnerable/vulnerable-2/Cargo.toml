[package]
edition = "2021"
name = "integer-overflow-or-underflow-vulnerable-2"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "=27.0.0-rc.1" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.0-rc.1", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
lto = true
opt-level = "z"
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
